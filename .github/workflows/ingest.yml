name: Ingest Repository

on:
  repository_dispatch:
    types: [ingest_repo]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job UUID to ingest"
        required: true
        type: string
      repo_id:
        description: "Repository UUID (optional)"
        required: false
        type: string
      access_token:
        description: "GitHub access token for private repositories (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ingest:
    name: Heavy Ingestion Runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ingest-${{ github.event.client_payload.job_id || inputs.job_id }}
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC || secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
      QDRANT_PORT: ${{ secrets.QDRANT_PORT || '6333' }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES || '1440' }}
      CHUNK_SIZE: ${{ vars.CHUNK_SIZE || '1500' }}
      CHUNK_OVERLAP: ${{ vars.CHUNK_OVERLAP || '200' }}
      DEBUG: ${{ vars.DEBUG || 'false' }}
      EMBEDDING_DIMENSION: ${{ vars.EMBEDDING_DIMENSION || '384' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'all-MiniLM-L6-v2' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-flash-lite-latest' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      MAX_FILE_SIZE_KB: ${{ vars.MAX_FILE_SIZE_KB || '500' }}

      REPOS_DIR: ./data/repos
      UPLOADS_DIR: ./data/uploads
      JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
      REPO_ID: ${{ github.event.client_payload.repo_id || inputs.repo_id || '' }}
      ACCESS_TOKEN: ${{ github.event.client_payload.access_token || inputs.access_token || '' }}

    steps:
      - name: Check out RepoPilot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required environment
        working-directory: backend
        run: |
          python - <<'PY'
          import os, sys
          required = [
              "DATABASE_URL",
              "JOB_ID",
              "GEMINI_API_KEY",
              "QDRANT_HOST",
          ]
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              print("Missing required env vars in GitHub Secrets:", ", ".join(missing))
              sys.exit(1)
          print("Environment validation passed.")
          PY

      - name: Run Ingestion Job
        id: run_ingest
        working-directory: backend
        run: |
          echo "Starting ingestion for Job: $JOB_ID"
          if [ -n "$ACCESS_TOKEN" ]; then
            python -m app.worker run-job --job-id "$JOB_ID" --access-token "$ACCESS_TOKEN"
          else
            python -m app.worker run-job --job-id "$JOB_ID"
          fi

      - name: Mark Job Failed on Runner Error
        if: failure()
        working-directory: backend
        run: |
          if [ -n "$JOB_ID" ]; then
            echo "Execution failed. Recording durable failure status for Job $JOB_ID..."
            python -m app.worker fail-job --job-id "$JOB_ID" --error "GitHub Actions workflow run failed. Check Actions tab logs for details." || true
          fi